name: Persistent Login (Contas 21-25)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # Executa a cada 6 horas

concurrency:
  group: persistent-login-21-25
  cancel-in-progress: false # Evita execução simultânea; nova espera a anterior terminar

permissions:
  contents: read
  actions: write

jobs:
  persistent-login-21-25:
    if: ${{ vars.HABILITAR_REINICIO == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instala dependências
        run: |
          pip install selenium webdriver-manager colorama

      - name: Executa login persistente (Contas 21-25)
        env:
          HABBLIVE_USERNAME_21: ${{ secrets.HABBLIVE_USERNAME_21 }}
          HABBLIVE_PASSWORD_21: ${{ secrets.HABBLIVE_PASSWORD_21 }}
          HABBLIVE_USERNAME_22: ${{ secrets.HABBLIVE_USERNAME_22 }}
          HABBLIVE_PASSWORD_22: ${{ secrets.HABBLIVE_PASSWORD_22 }}
          HABBLIVE_USERNAME_23: ${{ secrets.HABBLIVE_USERNAME_23 }}
          HABBLIVE_PASSWORD_23: ${{ secrets.HABBLIVE_PASSWORD_23 }}
          HABBLIVE_USERNAME_24: ${{ secrets.HABBLIVE_USERNAME_24 }}
          HABBLIVE_PASSWORD_24: ${{ secrets.HABBLIVE_PASSWORD_24 }}
          HABBLIVE_USERNAME_25: ${{ secrets.HABBLIVE_USERNAME_25 }}
          HABBLIVE_PASSWORD_25: ${{ secrets.HABBLIVE_PASSWORD_25 }}
          ACCOUNT_IDS: "21,22,23,24,25"
          COMMAND_POLL_INTERVAL: "20"
          COMMAND_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python persistent_login.py

      - name: Auto-disparo para reinício imediato
        if: ${{ vars.HABILITAR_REINICIO == 'true' }}
        run: |
          echo "Reiniciando workflow imediatamente..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/persistent-login-21-25.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}"}'
