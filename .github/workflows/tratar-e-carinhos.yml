name: (Comando) Tratar e Carinhos

on:
  workflow_dispatch:
    inputs:
      contas_01_05:
        description: "Contas 01-05"
        required: false
        default: false
        type: boolean
      contas_06_10:
        description: "Contas 06-10"
        required: false
        default: false
        type: boolean
      contas_11_15:
        description: "Contas 11-15"
        required: false
        default: false
        type: boolean
      contas_16_20:
        description: "Contas 16-20"
        required: false
        default: false
        type: boolean
      contas_21_25:
        description: "Contas 21-25"
        required: false
        default: false
        type: boolean
      contas_26_30:
        description: "Contas 26-30"
        required: false
        default: false
        type: boolean
      contas_31_35:
        description: "Contas 31-35"
        required: false
        default: false
        type: boolean
      contas_36_40:
        description: "Contas 36-40"
        required: false
        default: false
        type: boolean
      contas_41_45:
        description: "Contas 41-45"
        required: false
        default: false
        type: boolean
      contas_46_50:
        description: "Contas 46-50"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/Sao_Paulo"

# O cron dispara diariamente às 03h em Brasília.
# Para publicar comandos automáticos, habilite a variável de repositório:
# TRATAR_CARINHOS_AUTO = true
# E defina os grupos automáticos em:
# TRATAR_CARINHOS_GRUPOS = 01-05,06-10 (ou todos)
# Com AUTO diferente de 'true', a execução agendada fica ignorada.
permissions:
  contents: write

jobs:
  publicar-comando-tratar-carinhos:
    if: ${{ github.event_name != 'schedule' || vars.TRATAR_CARINHOS_AUTO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validar e publicar TRATAR E CARINHOS
        uses: actions/github-script@v7
        env:
          GRUPOS_AUTO: ${{ vars.TRATAR_CARINHOS_GRUPOS }}
        with:
          script: |
            const inputs = context.payload.inputs || {};
            const agendado = context.eventName === 'schedule';
            const grupos = [
              { campo: 'contas_01_05', faixa: '01-05', contas: [1, 2, 3, 4, 5] },
              { campo: 'contas_06_10', faixa: '06-10', contas: [6, 7, 8, 9, 10] },
              { campo: 'contas_11_15', faixa: '11-15', contas: [11, 12, 13, 14, 15] },
              { campo: 'contas_16_20', faixa: '16-20', contas: [16, 17, 18, 19, 20] },
              { campo: 'contas_21_25', faixa: '21-25', contas: [21, 22, 23, 24, 25] },
              { campo: 'contas_26_30', faixa: '26-30', contas: [26, 27, 28, 29, 30] },
              { campo: 'contas_31_35', faixa: '31-35', contas: [31, 32, 33, 34, 35] },
              { campo: 'contas_36_40', faixa: '36-40', contas: [36, 37, 38, 39, 40] },
              { campo: 'contas_41_45', faixa: '41-45', contas: [41, 42, 43, 44, 45] },
              { campo: 'contas_46_50', faixa: '46-50', contas: [46, 47, 48, 49, 50] },
            ];

            let selecionados;
            if (agendado) {
              const config = String(process.env.GRUPOS_AUTO || '').trim().toLowerCase();
              if (!config) {
                core.setFailed('Agendamento ativo, mas TRATAR_CARINHOS_GRUPOS não foi definido. Use: 01-05,06-10 ou todos.');
                return;
              }
              const solicitados = new Set(config.split(/[,;\s]+/).filter(Boolean));
              const invalidos = [...solicitados].filter(s => s !== 'todos' && !grupos.some(g => g.faixa === s));
              if (invalidos.length) {
                core.setFailed(`Grupos automáticos desconhecidos: ${invalidos.join(', ')}`);
                return;
              }
              selecionados = solicitados.has('todos')
                ? grupos
                : grupos.filter(g => solicitados.has(g.faixa));
            } else {
              selecionados = grupos.filter(g =>
                inputs[g.campo] === true || inputs[g.campo] === 'true'
              );
            }
            if (!selecionados.length) {
              core.setFailed('Selecione ao menos um grupo (manual), ou configure TRATAR_CARINHOS_GRUPOS (agendado).');
              return;
            }

            const contas = selecionados.flatMap(g => g.contas);
            const runId = process.env.GITHUB_RUN_ID;
            const attempt = process.env.GITHUB_RUN_ATTEMPT || '1';
            if (!runId) {
              core.setFailed('GITHUB_RUN_ID indisponível.');
              return;
            }
            const id = `${runId}-${attempt}`;
            const comando = {
              id,
              action: 'treat_pets',
              targets: contas,
              created_at: new Date().toISOString(),
            };
            const caminho = `commands/${id}.json`;
            const branch = context.ref.replace(/^refs\/heads\//, '');

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: caminho,
              message: `TRATAR E CARINHOS: publicar comando ${id}`,
              content: Buffer.from(JSON.stringify(comando, null, 2)).toString('base64'),
              branch,
            });
            core.info(`TRATAR E CARINHOS publicado: ${id}`);
            core.info(`Origem: ${agendado ? 'agendamento 03h Brasília' : 'execução manual'}`);
            core.info(`Grupos: ${selecionados.map(g => g.faixa).join(', ')}`);
            core.info(`Contas selecionadas: ${contas.join(', ')}`);
            core.info(`Arquivo: ${caminho}`);
